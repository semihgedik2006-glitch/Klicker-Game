<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src https://*.supabase.co; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="robots" content="noindex">
  <title>Jarvis</title>
  <link rel="icon" href="../icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="jarvis.css">
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true"><ol id="boot-zeilen"></ol></div>

  <main id="anmelden" class="anmelden" hidden>
    <svg class="marke" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" /><circle cx="24" cy="24" r="12" /><circle cx="24" cy="24" r="3.5" /></svg>
    <h1>Jarvis</h1>
    <p class="leise">Melde dich mit deinem Konto aus der Lern-App an.</p>
    <form id="anmelde-form">
      <label>E-Mail<input type="email" name="email" autocomplete="email" required></label>
      <label>Passwort<input type="password" name="passwort" autocomplete="current-password" required></label>
      <button type="submit" class="knopf">Anmelden</button>
      <p id="anmelde-fehler" class="fehler" role="alert"></p>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <header class="kopf">
      <div class="kopf-links">
        <svg class="marke klein" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" /><circle cx="24" cy="24" r="12" /><circle cx="24" cy="24" r="3.5" /></svg>
        <div>
          <h1>Jarvis</h1>
          <p id="begruessung" class="leise"></p>
        </div>
      </div>
      <ul id="status" class="status"></ul>
      <button id="abmelden" class="knopf-leise" type="button">Abmelden</button>
    </header>

    <div class="raster">
      <section class="spalte haupt" aria-labelledby="t-gespraech">
        <h2 id="t-gespraech">Gespräch</h2>
        <ol id="verlauf" class="verlauf" aria-live="polite"></ol>
        <form id="auftrag-form" class="auftrag">
          <label for="auftrag" class="unsichtbar">Auftrag an Jarvis</label>
          <textarea id="auftrag" rows="2" placeholder="Gib Jarvis einen Auftrag, z. B. „Plan mir die Woche“"></textarea>
          <button type="submit" class="knopf">Senden</button>
        </form>
      </section>

      <aside class="spalte seite">
        <section aria-labelledby="t-woche">
          <h2 id="t-woche">Wochenzahlen</h2>
          <ul id="zahlen" class="zahlen"></ul>
          <p id="zahlen-leer" class="leise" hidden>Noch kein Wochen-Check. Der erste kommt Sonntag.</p>
        </section>

        <section aria-labelledby="t-erinnerungen">
          <h2 id="t-erinnerungen">Anstehend</h2>
          <ul id="erinnerungen" class="zeilen"></ul>
        </section>

        <section aria-labelledby="t-gedaechtnis">
          <div class="abschnitt-kopf">
            <h2 id="t-gedaechtnis">Gedächtnis</h2>
            <span id="gedaechtnis-zahl" class="leise"></span>
          </div>
          <input id="suche" class="suche" type="search" placeholder="Durchsuchen" aria-label="Gedächtnis durchsuchen">
          <ul id="gedaechtnis" class="zeilen gedaechtnis"></ul>
        </section>
      </aside>
    </div>
  </div>

  <script src="../js/konto-config.js"></script>
  <script src="jarvis.js"></script>
</body>
</html>
